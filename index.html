<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MintLeaf — Legacy Before</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
    <style>
      /* 
        Layout and scrolling solution:
        1. Create a fixed, non-scrollable root container for the app.
        2. Delegate scrolling to specific inner components.
      */
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
      }

      #root {
        /* Make the React app container a fixed block that fills the viewport... */
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        /* ...but which CANNOT scroll itself. Scrolling is handled inside the app. */
        overflow: hidden;
        
        /* Improve scrolling performance on touch devices for child elements */
        -webkit-overflow-scrolling: touch;
      }
    </style>

</head>
<body>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
</body>
</html>
